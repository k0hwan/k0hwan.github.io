{% raw %}
<!-- ============================================================
     User Study Signup  ·  drop-in page for al-folio
     1) Set API_URL below to your Apps Script /exec URL.
     2) Everything else is driven by the Google Sheet.
     Colors/fonts inherit al-folio theme vars → theme color and
     dark mode follow the site automatically.
     CSS is inlined on purpose: purgecss only touches assets/css.
     ============================================================ -->

<div class="us" id="us-root">
  <div class="us-state" id="us-loading">
    <span class="us-spinner" aria-hidden="true"></span>
    <span>실험 정보를 불러오는 중…</span>
  </div>

  <div class="us-state us-state--error" id="us-error" hidden>
    <p>정보를 불러오지 못했습니다. 실험 진행자에게 문의해주세요.</p>
    <button type="button" class="us-btn us-btn--ghost" id="us-retry">다시 시도</button>
  </div>

  <main id="us-main" hidden></main>
</div>

<style>
/* ---------- tokens: everything derives from al-folio theme vars ---------- */
.us {
  --accent: var(--global-theme-color, #00ab37);
  --ink: var(--global-text-color, #1c1c1c);
  --ink-soft: var(--global-text-color-light, #828282);
  --paper: var(--global-bg-color, #fff);
  --line: var(--global-divider-color, rgba(128,128,128,.28));

  --tint-10: color-mix(in srgb, var(--accent) 10%, transparent);
  --tint-18: color-mix(in srgb, var(--accent) 18%, transparent);
  --tint-40: color-mix(in srgb, var(--accent) 40%, transparent);
  --tint-70: color-mix(in srgb, var(--accent) 70%, transparent);
  --dim: color-mix(in srgb, var(--ink) 9%, transparent);

  --headh: 30px;        /* date-column header height */
  --r: 8px;

  color: var(--ink);
  max-width: 100%;
}
.us *, .us *::before, .us *::after { box-sizing: border-box; }

/* ---------- states ---------- */
.us-state {
  display: flex; align-items: center; justify-content: center; gap: .6rem;
  min-height: 180px; color: var(--ink-soft); font-size: .95rem; text-align: center; flex-wrap: wrap;
}
.us-state--error { flex-direction: column; }
.us-spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid var(--tint-40); border-top-color: var(--accent);
  animation: us-spin .7s linear infinite;
}
@keyframes us-spin { to { transform: rotate(360deg); } }

/* ---------- header ---------- */
.us-eyebrow {
  font-size: .7rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin-bottom: .5rem;
}
.us-title { font-size: 1.7rem; line-height: 1.3; margin: 0 0 .6rem; font-weight: 500; }
.us-lead { color: var(--ink-soft); margin: 0 0 1.6rem; line-height: 1.7; white-space: pre-line; }

/* ---------- meta ---------- */
.us-meta { border-top: 1px solid var(--line); margin: 0 0 1.5rem; }
.us-meta div {
  display: grid; grid-template-columns: 6.5rem 1fr; gap: .4rem 1rem;
  padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: .93rem;
}
.us-meta dt { color: var(--ink-soft); margin: 0; }
.us-meta dd { margin: 0; white-space: pre-line; }
.us-meta a { color: var(--accent); }

/* ---------- quota ---------- */
.us-quota { display: flex; flex-wrap: wrap; gap: .45rem; margin: 0 0 .4rem; }
.us-pill {
  display: inline-flex; align-items: baseline; gap: .35rem;
  border: 1px solid var(--line); border-radius: 999px; padding: .28rem .8rem;
  font-size: .82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
}
.us-pill b { color: var(--accent); font-weight: 600; }
.us-pill--full { border-color: transparent; background: var(--dim); }
.us-pill--full b { color: var(--ink-soft); }

/* ---------- section heads ---------- */
.us-h { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin: 3rem 0 .5rem; }
.us-h h3 { font-size: 1.15rem; font-weight: 500; margin: 0; }
.us-hint { color: var(--ink-soft); font-size: .85rem; margin: 0 0 1.1rem; line-height: 1.6; }

/* ---------- form ---------- */
.us-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.us-field { display: flex; flex-direction: column; gap: .35rem; }
.us-field--wide { grid-column: 1 / -1; }
.us-field label { font-size: .84rem; color: var(--ink-soft); }
.us-field label span { color: var(--accent); }
.us-field input, .us-field textarea {
  font: inherit; font-size: .92rem; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: var(--r);
  padding: .55rem .7rem; width: 100%;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.us-field input:focus, .us-field textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--tint-18);
}
.us-field textarea { resize: vertical; min-height: 70px; }
.us-radios { display: flex; gap: .5rem; }
.us-radios label {
  flex: 1; text-align: center; border: 1px solid var(--line); border-radius: var(--r);
  padding: .55rem .4rem; cursor: pointer; font-size: .9rem; color: var(--ink);
  transition: border-color .12s ease, background-color .12s ease;
}
.us-radios input { position: absolute; opacity: 0; pointer-events: none; }
.us-radios label:hover { border-color: var(--tint-70); }
.us-radios label:has(input:checked) { border-color: var(--accent); background: var(--tint-10); font-weight: 500; }
.us-radios label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.us-radios label:has(input:disabled) {
  cursor: not-allowed; color: var(--ink-soft); background: var(--dim); border-color: transparent;
}
.us-radios label i { font-style: normal; font-size: .74rem; color: var(--ink-soft); }
.us-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

/* ---------- day cards, side by side ---------- */
.us-days { display: flex; flex-wrap: nowrap; gap: 1rem; align-items: stretch; 
  overflow-x: auto; padding-bottom: .6rem; }
.us-day {
  flex: 0 0 var(--day-w); min-width: var(--day-w);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 1rem .85rem .85rem;
  display: flex; flex-direction: column;
}
.us-dayhead { text-align: center; margin-bottom: .9rem; }
.us-dayhead h4 {
  font-size: 1rem; font-weight: 500; margin: 0;
  display: inline-flex; align-items: baseline; gap: .45rem;
}
.us-chip {
  font-size: .7rem; letter-spacing: .03em; color: var(--accent);
  background: var(--tint-10); border-radius: 4px; padding: .12rem .4rem;
  font-variant-numeric: tabular-nums; font-weight: 500;
}
.us-daynote { font-size: .78rem; color: var(--ink-soft); margin: .35rem 0 0; line-height: 1.5; }

/* ---------- board ---------- */
.us-board { display: flex; gap: .5rem; flex: 1 1 auto; }
.us-axis {
  position: relative; flex: 0 0 36px; padding-top: var(--headh);
  height: var(--board-h);
}
.us-axis span {
  position: absolute; right: 0; transform: translateY(-50%);
  top: var(--top);
  font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
}
.us-scroll { flex: 1 1 auto; overflow-x: auto; overflow-y: hidden; }
.us-cols {
  position: relative; display: grid; grid-auto-flow: column;
  grid-auto-columns: minmax(64px, 1fr); gap: .45rem; min-width: 100%;
}
.us-lines { position: absolute; left: 0; right: 0; top: var(--headh); bottom: 0; pointer-events: none; }
.us-lines i {
  position: absolute; left: 0; right: 0; height: 0;
  top: var(--top);
  border-top: 1px dashed var(--line); opacity: .7;
}
.us-col { position: relative; z-index: 1; }
.us-colhead {
  height: var(--headh); display: flex; align-items: center; justify-content: center;
  gap: .25rem; font-size: .8rem; font-weight: 500; white-space: nowrap;
}
.us-colhead em { font-style: normal; font-weight: 400; color: var(--ink-soft); font-size: .75rem; }
.us-colbody { position: relative; height: var(--body-h); }

/* ---------- slot ---------- */
.us-slot {
  position: absolute; left: 0; right: 0;
  top: var(--top);
  height: var(--slot-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; overflow: hidden; padding: 2px;
  border: 1px solid var(--tint-40); border-radius: 6px;
  background: var(--tint-10); color: var(--ink);
  font: inherit; font-size: .86rem; font-weight: 500; font-variant-numeric: tabular-nums;
  cursor: pointer; text-align: center; line-height: 1.25;
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease;
}
.us-slot small { font-size: .66rem; font-weight: 400; color: var(--ink-soft); }
.us-slot:hover:not(:disabled) {
  border-color: var(--tint-70); background: var(--tint-18); transform: translateY(-1px);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 20%, transparent);
}
.us-slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.us-slot[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 32%, transparent);
}
.us-slot[aria-pressed="true"] small { color: color-mix(in srgb, #fff 80%, transparent); }
.us-slot:disabled {
  cursor: not-allowed; background: var(--dim); border-color: transparent;
  color: var(--ink-soft); font-weight: 400; box-shadow: none;
}
.us-slot:disabled .us-t { text-decoration: line-through; text-decoration-thickness: 1px; }

.us-picked {
  margin: .8rem 0 0; padding-top: .6rem; border-top: 1px solid var(--line);
  font-size: .82rem; color: var(--ink-soft); text-align: center;
}
.us-picked b { color: var(--accent); font-weight: 600; }

/* ---------- actions ---------- */
.us-actions { margin-top: 1.8rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.us-btn {
  font: inherit; font-size: .95rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: #fff;
  border-radius: var(--r); padding: .65rem 1.8rem;
  transition: opacity .12s ease, transform .12s ease;
}
.us-btn:hover:not(:disabled) { opacity: .87; }
.us-btn:active:not(:disabled) { transform: translateY(1px); }
.us-btn:disabled { opacity: .45; cursor: not-allowed; }
.us-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.us-btn--ghost { background: transparent; color: var(--accent); }
.us-msg { font-size: .88rem; color: #e06c5e; margin: 0; }
.us-note { font-size: .78rem; color: var(--ink-soft); margin: 1.1rem 0 .7rem; line-height: 1.6; }

/* ---------- closed / done ---------- */
.us-closed { text-align: center; padding: 3.5rem 1rem; }
.us-closed .us-title { margin-bottom: 1.1rem; }
.us-closed p { color: var(--ink-soft); margin: 0; font-size: 1rem; }
.us-done { border: 1px solid var(--tint-40); background: var(--tint-10); border-radius: 10px; padding: 1.4rem; }
.us-done h3 { margin: 0 0 .8rem; font-size: 1.05rem; font-weight: 500; }
.us-done ul { margin: 0 0 .8rem; padding-left: 1.1rem; }
.us-done li { margin-bottom: .3rem; font-variant-numeric: tabular-nums; }
.us-done p { margin: .2rem 0; font-size: .9rem; color: var(--ink-soft); }

/* ---------- responsive ---------- */
@media (max-width: 620px) {
  .us { --headh: 27px; }
  .us-title { font-size: 1.4rem; }
  .us-grid { grid-template-columns: 1fr; }
  .us-meta div { grid-template-columns: 5.2rem 1fr; }
  .us-day { flex: 0 0 100%; min-width: 0; }
  .us-btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .us *, .us *::before { transition: none !important; animation-duration: .01ms !important; }
}
</style>

<script>
(function () {
  'use strict';

  /* ====== 1. YOUR APPS SCRIPT WEB APP URL ====== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwcN1ddtwG3aLLkl3MAEkX-tfKfWytlUqk30pSDajKOYTW_JNET0IrmOfvMzJTthKjX/exec';
  /* ============================================= */

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var root = document.getElementById('us-root');
  if (!root) return;
  var elLoading = document.getElementById('us-loading');
  var elError = document.getElementById('us-error');
  var elMain = document.getElementById('us-main');
  var DATA = null;
  var picked = {};   // dayId -> slotId

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* 시트 값이 링크로 나가는 자리는 스킴을 확인한다 (javascript: 등 차단) */
  function safeUrl(u) {
    u = String(u || '').trim();
    return /^https?:\/\//i.test(u) ? u : '';
  }
  function safeMail(a) {
    a = String(a || '').trim();
    return /^[^\s@]{1,64}@[^\s@]{1,63}\.[A-Za-z]{2,}$/.test(a) ? a : '';
  }

  function toMin(hhmm) { var p = String(hhmm).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function fromMin(m) {
    var h = Math.floor(m / 60) % 24, x = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (x < 10 ? '0' : '') + x;
  }
  function dateLabel(iso) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return { md: (+p[1]) + '/' + (+p[2]), dow: DOW[d.getDay()] };
  }

  /* JSONP for reads: no CORS surface at all */
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cb = '__usCb' + Math.random().toString(36).slice(2);
      var s = document.createElement('script'), done = false;
      window[cb] = function (d) { done = true; cleanup(); resolve(d); };
      function cleanup() {
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      s.onerror = function () { cleanup(); reject(new Error('network')); };
      s.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cb + '&_=' + Date.now();
      document.head.appendChild(s);
      setTimeout(function () { if (!done) { cleanup(); reject(new Error('timeout')); } }, 15000);
    });
  }

  /* ---------- load ---------- */
  function load() {
    elError.hidden = true; elLoading.hidden = false; elMain.hidden = true;
    if (window.__US_MOCK) {                 // 시트 연결 전 로컬 미리보기용
      DATA = window.__US_MOCK;
      elLoading.hidden = true; elMain.hidden = false;
      render();
      return Promise.resolve();
    }
    return jsonp(API_URL).then(function (res) {
      if (!res || !res.ok) throw new Error(res && res.message || 'bad response');
      DATA = res.data;
      elLoading.hidden = true; elMain.hidden = false;
      render();
    }).catch(function (err) {
      console.error('[userstudy]', err);
      elLoading.hidden = true; elError.hidden = false;
    });
  }
  document.getElementById('us-retry').addEventListener('click', load);

  /* ---------- render ---------- */
  function render() {
    var c = DATA.config;
    if (DATA.closed) {
      elMain.innerHTML =
        '<div class="us-closed">' +
        '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
        '<h2 class="us-title">' + esc(c.title || '') + '</h2>' +
        '<p>' + esc(c.closed_message || '모집이 모두 마감되었습니다. 감사합니다.') + '</p>' +
        '</div>';
      return;
    }
    elMain.innerHTML =
      header(c) +
      '<form id="us-form" novalidate>' + fields(c) + schedule() + actions(c) + '</form>';
    bind();
  }

  function header(c) {
    var mail = safeMail(c.contact);
    var rows = [
      ['장소', c.location, safeUrl(c.location_url)],
      ['소요 시간', c.duration_note, ''],
      ['사례', c.reward, ''],
      ['참가 조건', c.requirements, ''],
      ['문의', c.contact, mail ? 'mailto:' + mail : '']
    ].filter(function (r) { return r[1]; }).map(function (r) {
      var v = r[2] ? '<a href="' + esc(r[2]) + '" target="_blank" rel="noopener noreferrer">' + esc(r[1]) + '</a>' : esc(r[1]);
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + v + '</dd></div>';
    }).join('');

    return '<header>' +
      '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
      '<h2 class="us-title">' + esc(c.title || '') + '</h2>' +
      (c.description ? '<p class="us-lead">' + esc(c.description) + '</p>' : '') +
      (rows ? '<dl class="us-meta">' + rows + '</dl>' : '') +
      quota() +
      '</header>';
  }

  function quota() {
    var s = DATA.stats;
    if (!s || !DATA.config.show_remaining) return '';
    function pill(label, o) {
      if (!o || !o.target) return '';
      var full = o.left <= 0;
      return '<span class="us-pill' + (full ? ' us-pill--full' : '') + '">' + esc(label) +
        (full ? '<b>마감</b>' : '<b>' + o.left + '</b>명') + '</span>';
    }
    var html = pill('전체', s.total) + pill('남성', s.male) + pill('여성', s.female);
    return html ? '<div class="us-h"><h3>잔여 모집 인원</h3></div>' + 
      '<div class="us-quota">' + html + '</div>' : '';
  }

  function fields(c) {
    var s = DATA.stats || {};
    var mFull = s.male && s.male.target && s.male.left <= 0;
    var fFull = s.female && s.female.target && s.female.left <= 0;
    return '<div class="us-h"><h3>참가자 정보</h3></div>' +
      '<div class="us-grid">' +
        '<div class="us-field"><label for="us-name">이름 <span>*</span></label>' +
          '<input id="us-name" name="name" type="text" autocomplete="name" maxlength="30"></div>' +
        '<div class="us-field"><label>성별 <span>*</span></label><div class="us-radios">' +
          '<label><input type="radio" name="gender" value="M"' + (mFull ? ' disabled' : '') + '>남성' + (mFull ? ' <i>(마감)</i>' : '') + '</label>' +
          '<label><input type="radio" name="gender" value="F"' + (fFull ? ' disabled' : '') + '>여성' + (fFull ? ' <i>(마감)</i>' : '') + '</label>' +
        '</div></div>' +
        '<div class="us-field"><label for="us-phone">휴대폰 번호 <span>*</span></label>' +
          '<input id="us-phone" name="phone" type="tel" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel" maxlength="13"></div>' +
        '<div class="us-field"><label for="us-email">이메일 <span>*</span></label>' +
          '<input id="us-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="80"></div>' +
        '<div class="us-field us-field--wide"><label for="us-memo">남기실 말 (선택)</label>' +
          '<textarea id="us-memo" name="memo" maxlength="300" placeholder="문의 사항이나 참고할 내용이 있다면 적어 주세요."></textarea></div>' +
      '</div>' +
      '<input class="us-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">';
  }

  function schedule() {
    return '<div class="us-h"><h3>시간 선택</h3></div>' +
      '<div class="us-days">' + DATA.days.map(dayCard).join('') + '</div>';
  }

  function dayCard(day) {
    var lo = Infinity, hi = -Infinity;
    day.dates.forEach(function (d) {
      d.slots.forEach(function (s) {
        var t = toMin(s.start);
        lo = Math.min(lo, t); hi = Math.max(hi, t + (s.duration || day.duration_min));
      });
    });
    if (!isFinite(lo)) return '';
    var start = Math.floor((lo - 15) / 30) * 30;
    var end = Math.ceil((hi + 15) / 30) * 30;
    var range = end - start;

    var ppm = window.innerWidth <= 620 ? 0.68 : 0.78;
    var headH = window.innerWidth <= 620 ? 27 : 30;
    var bodyH = range * ppm;
    var boardH = headH + bodyH;

    var colWidth = 80;
    var colGap = 7.2;
    var fixedWidth = 72;
    var n = day.dates.length;
    var dayWidth = Math.max(180, fixedWidth + n * colWidth + Math.max(0, n - 1) * colGap);

    var ticks = '', lines = '';
    for (var t = Math.ceil(start / 60) * 60; t <= end; t += 60) {
      ticks += '<span style="--top:' + (headH + (t - start) * ppm) + 'px">' + fromMin(t) + '</span>';
      if (t <= end - 5) lines += '<i style="--top:' + ((t - start) * ppm) + 'px"></i>';
    }

    var cols = day.dates.map(function (d) {
      var lab = dateLabel(d.date);
      var slots = d.slots.map(function (s) {
        var dur = s.duration || day.duration_min;
        var open = s.available;
        var tag = open ? (s.left > 1 ? s.left + '자리' : '') : (s.reason === 'past' ? '종료' : '마감');
        var topPx = (toMin(s.start) - start) * ppm;
        var heightPx = Math.max(dur * ppm - 4, 24);
        return '<button type="button" class="us-slot"' +
          ' style="--top:' + topPx + 'px;--slot-h:' + heightPx + 'px"' +
          ' data-day="' + esc(day.id) + '" data-slot="' + esc(s.id) + '" aria-pressed="false"' +
          (open ? '' : ' disabled') +
          ' aria-label="' + esc(lab.md + ' ' + s.start + '–' + fromMin(toMin(s.start) + dur) + (open ? '' : ' ' + tag)) + '">' +
          '<span class="us-t">' + esc(s.start) + '</span>' +
          (tag ? '<small>' + esc(tag) + '</small>' : '') +
          '</button>';
      }).join('');
      return '<div class="us-col"><div class="us-colhead">' + lab.md +
        ' <em>(' + lab.dow + ')</em></div><div class="us-colbody" style="--body-h:' + bodyH + 'px">' + slots + '</div></div>';
    }).join('');

    return '<section class="us-day" style="--cols:' + day.dates.length +
  ';--day-w:' + dayWidth + 'px" data-day="' + esc(day.id) + '">' +
      '<div class="us-dayhead"><h4>' + esc(day.label) +
      '<span class="us-chip">' + day.duration_min + '분</span></h4>' +
      (day.note ? '<p class="us-daynote">' + esc(day.note) + '</p>' : '') + '</div>' +
      '<div class="us-board" style="--board-h:' + boardH + 'px">' +
      '<div class="us-axis">' + ticks + '</div>' +
      '<div class="us-scroll"><div class="us-cols">' +
      '<div class="us-lines">' + lines + '</div>' + cols +
      '</div></div></div>' +
      '<p class="us-picked" data-picked="' + esc(day.id) + '">시간을 선택해 주세요</p>' +
      '</section>';
  }

  function actions(c) {
    return (c.privacy_note ? '<p class="us-note">' + esc(c.privacy_note) + '</p>' : '') +
      '<div class="us-actions">' +
      '<button type="submit" class="us-btn" id="us-submit">' + esc(c.submit_label || '신청하기') + '</button>' +
      '<p class="us-msg" id="us-msg" role="alert"></p></div>';
  }

  /* ---------- interaction ---------- */
  function bind() {
    elMain.querySelectorAll('.us-slot').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var day = btn.dataset.day, slot = btn.dataset.slot;
        var same = picked[day] === slot;
        elMain.querySelectorAll('.us-slot[data-day="' + day + '"]').forEach(function (b) {
          b.setAttribute('aria-pressed', 'false');
        });
        if (same) { delete picked[day]; } else { picked[day] = slot; btn.setAttribute('aria-pressed', 'true'); }
        updatePicked(day);
      });
    });

    var phone = document.getElementById('us-phone');
    phone.addEventListener('input', function () {
      var v = phone.value.replace(/\D/g, '').slice(0, 11);
      phone.value = v.length > 7 ? v.slice(0, 3) + '-' + v.slice(3, v.length - 4) + '-' + v.slice(-4)
        : v.length > 3 ? v.slice(0, 3) + '-' + v.slice(3) : v;
    });

    document.getElementById('us-form').addEventListener('submit', submit);
  }

  function updatePicked(dayId) {
    var day = DATA.days.filter(function (d) { return d.id === dayId; })[0];
    var el = elMain.querySelector('[data-picked="' + dayId + '"]');
    var id = picked[dayId];
    if (!id) { el.textContent = '시간을 선택해 주세요'; return; }
    var found;
    day.dates.forEach(function (d) {
      d.slots.forEach(function (s) { if (s.id === id) found = { d: d, s: s }; });
    });
    if (!found) return;
    var lab = dateLabel(found.d.date);
    var dur = found.s.duration || day.duration_min;
    el.innerHTML = '<b>' + esc(lab.md + ' (' + lab.dow + ') ' + found.s.start + '–' +
      fromMin(toMin(found.s.start) + dur)) + '</b>';
  }

  function submit(e) {
    e.preventDefault();
    var msg = document.getElementById('us-msg');
    var btn = document.getElementById('us-submit');
    msg.textContent = '';

    var name = document.getElementById('us-name').value.trim();
    var gender = (elMain.querySelector('input[name="gender"]:checked') || {}).value;
    var phoneV = document.getElementById('us-phone').value.trim();
    var email = document.getElementById('us-email').value.trim();

    if (name.length < 2) return fail(msg, '이름을 입력해 주세요.');
    if (!gender) return fail(msg, '성별을 선택해 주세요.');
    if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test(phoneV)) return fail(msg, '휴대폰 번호를 정확히 입력해 주세요.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail(msg, '이메일을 정확히 입력해 주세요.');

    var missing = DATA.days.filter(function (d) { return !picked[d.id]; });
    if (missing.length) {
      var card = elMain.querySelector('.us-day[data-day="' + missing[0].id + '"]');
      if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return fail(msg, missing[0].label + ' 시간을 선택해 주세요.');
    }

    var payload = {
      name: name, gender: gender, phone: phoneV, email: email,
      memo: document.getElementById('us-memo').value.trim(),
      website: elMain.querySelector('input[name="website"]').value,
      slots: DATA.days.map(function (d) { return picked[d.id]; })
    };

    btn.disabled = true; btn.textContent = '신청 중…';
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request → no CORS preflight
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok) return done(res.result);
      btn.disabled = false; btn.textContent = DATA.config.submit_label || '신청하기';
      msg.textContent = (res && res.message) || '신청에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      if (res && (res.error === 'SLOT_TAKEN' || res.error === 'FULL' || res.error === 'CLOSED')) {
        picked = {}; load();
      }
    }).catch(function (err) {
      console.error('[userstudy]', err);
      btn.disabled = false; btn.textContent = DATA.config.submit_label || '신청하기';
      msg.textContent = '네트워크 오류입니다. 잠시 후 다시 시도해 주세요.';
    });
  }

  function fail(msg, text) { msg.textContent = text; return false; }

  function done(result) {
    var c = DATA.config;
    var items = (result.items || []).map(function (i) {
      var lab = dateLabel(i.date);
      return '<li>' + esc(i.day + ' — ' + lab.md + ' (' + lab.dow + ') ' + i.start + '–' + i.end) + '</li>';
    }).join('');
    elMain.innerHTML =
      '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
      '<h2 class="us-title">신청이 완료되었습니다</h2>' +
      '<div class="us-done"><h3>' + esc(c.title || '') + '</h3><ul>' + items + '</ul>' +
      (c.location ? '<p>장소 · ' + esc(c.location) + '</p>' : '') +
      '<p>예약 번호 · ' + esc(result.id) + '</p></div>' +
      '<p class="us-note">일정 변경이나 취소가 필요하면 ' +
      (safeMail(c.contact) ? '<a href="mailto:' + esc(safeMail(c.contact)) + '">' + esc(c.contact) + '</a>'
                           : esc(c.contact || '담당자')) +
      '로 알려 주세요.</p>';
    window.scrollTo({ top: root.offsetTop - 60, behavior: 'smooth' });
  }

  load();
})();
</script>
