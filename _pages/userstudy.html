<script>
  (function () {

    /* ============================================= */

    var DOW = ['일', '월', '화', '수', '목', '금', '토'];
    var root = document.getElementById('us-root');
    if (!root) return;
    var elLoading = document.getElementById('us-loading');
    var elError = document.getElementById('us-error');
    var elMain = document.getElementById('us-main');

    var picked = {};   // dayId -> slotId

    /* ---------- helpers ---------- */
    /**
     * 설명 블록용 최소 마크다운.
     *  **굵게** · *기울임* · `코드` · [텍스트](https://…) · "- " 목록
     *  빈 줄로 문단 분리 · 줄머리 ">" 또는 "|" 는 인용문
     * 반드시 esc() 로 먼저 이스케이프한 뒤 태그를 만들기 때문에 시트 값이
     * HTML 로 해석되는 경로는 없다. 링크는 http/https 만 허용한다.
     */
    function mdLite(src) {
      var raw = String(src == null ? '' : src);
      if (!raw.trim()) return '';

      function inline(t) {
        var codes = [];
        t = t.replace(/`([^`]+)`/g, function (m, c) {
          codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001';
        });
        t = t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
          if (!/^https?:\/\//i.test(url)) return m;          // javascript: 등은 원문 그대로 노출
          return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
        });
        t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
        return t.replace(/\u0001(\d+)\u0001/g, function (m, i) {
          return '<code>' + codes[+i] + '</code>';
        });
      }

      return esc(raw)
        .replace(/\r\n?/g, '\n')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
        .split(/\n{2,}/)
        .map(function (block) {
          var lines = block.split('\n').filter(function (l) { return l.trim() !== ''; });
          if (!lines.length) return '';
          if (lines.every(function (l) { return /^\s*-\s+/.test(l); })) {
            return '<ul>' + lines.map(function (l) {
              return '<li>' + inline(l.replace(/^\s*-\s+/, '')) + '</li>';
            }).join('') + '</ul>';
          }
          if (lines.every(function (l) { return /^\s*(&gt;|\|)\s?/.test(l); })) {
            return '<blockquote>' + lines.map(function (l) {
              return inline(l.replace(/^\s*(&gt;|\|)\s?/, ''));
            }).join('<br>') + '</blockquote>';
          }
          return '<p>' + lines.map(inline).join('<br>') + '</p>';
        })
        .join('');
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    /* 시트 값이 링크로 나가는 자리는 스킴을 확인한다 (javascript: 등 차단) */
    function safeUrl(u) {
      u = String(u || '').trim();
      return /^https?:\/\//i.test(u) ? u : '';
    }
    function safeMail(a) {
      a = String(a || '').trim();
      return /^[^\s@]{1,64}@[^\s@]{1,63}\.[A-Za-z]{2,}$/.test(a) ? a : '';
    }

    function toMin(hhmm) { var p = String(hhmm).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
    function fromMin(m) {
      var h = Math.floor(m / 60) % 24, x = m % 60;
      return (h < 10 ? '0' : '') + h + ':' + (x < 10 ? '0' : '') + x;
    }
    function isHoliday(iso) {
      var raw = DATA && DATA.config ? DATA.config.holiday_dates : '';
      return String(raw || '').split(/[,\s]+/).filter(Boolean).indexOf(iso) !== -1;
    }
    function dateLabel(iso) {
      var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
      return { md: (+p[1]) + '/' + (+p[2]), dow: DOW[d.getDay()], dowNum: d.getDay(), holiday: isHoliday(iso) };
    }

    /* JSONP for reads: no CORS surface at all */
    function jsonp(url) {
      return new Promise(function (resolve, reject) {
        var cb = '__usCb' + Math.random().toString(36).slice(2);
        var s = document.createElement('script'), done = false;
        window[cb] = function (d) { done = true; cleanup(); resolve(d); };
        function cleanup() {
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          if (s.parentNode) s.parentNode.removeChild(s);
        }
        s.onerror = function () { cleanup(); reject(new Error('network')); };
        s.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cb + '&_=' + Date.now();
        document.head.appendChild(s);
        setTimeout(function () { if (!done) { cleanup(); reject(new Error('timeout')); } }, 15000);
      });
    }

    /* ---------- load ---------- */
    function load() {
      elError.hidden = true; elLoading.hidden = false; elMain.hidden = true;
      if (window.__US_MOCK) {                 // 시트 연결 전 로컬 미리보기용
        DATA = window.__US_MOCK;
        elLoading.hidden = true; elMain.hidden = false;
        render();
        return Promise.resolve();
      }
      return jsonp(API_URL).then(function (res) {
        if (!res || !res.ok) throw new Error(res && res.message || 'bad response');
        DATA = res.data;
        elLoading.hidden = true; elMain.hidden = false;
        render();
      }).catch(function (err) {
        console.error('[userstudy]', err);
        elLoading.hidden = true; elError.hidden = false;
      });
    }
    document.getElementById('us-retry').addEventListener('click', load);

    /* ---------- render ---------- */
    function render() {
      var c = DATA.config;
      if (DATA.closed) {
        elMain.innerHTML =
          '<div class="us-closed">' +
          '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
          '<h2 class="us-title">' + esc(c.title || '') + '</h2>' +
          '<p>' + esc(c.closed_message || '모집이 모두 마감되었습니다. 감사합니다.') + '</p>' +
          '</div>';
        return;
      }
      elMain.innerHTML =
        header(c) +
        '<form id="us-form" novalidate>' + fields(c) + schedule() + actions(c) + '</form>';
      bind();
    }

    function header(c) {
      var mail = safeMail(c.contact);
      var rows = [
        ['장소', c.location, safeUrl(c.location_url)],
        ['소요 시간', c.duration_note, ''],
        ['사례', c.reward, ''],
        ['참가 조건', c.requirements, ''],
        ['문의', c.contact, mail ? 'mailto:' + mail : '']
      ].filter(function (r) { return r[1]; }).map(function (r) {
        var v = r[2] ? '<a href="' + esc(r[2]) + '" target="_blank" rel="noopener noreferrer">' + esc(r[1]) + '</a>' : esc(r[1]);
        return '<div><dt>' + esc(r[0]) + '</dt><dd>' + v + '</dd></div>';
      }).join('');

      return '<header>' +
        '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
        '<h2 class="us-title">' + esc(c.title || '') + '</h2>' +
        (c.description ? '<p class="us-lead">' + esc(c.description) + '</p>' : '') +
        (rows ? '<dl class="us-meta">' + rows + '</dl>' : '') +
        quota() +
        '</header>';
    }

    function quota() {
      var s = DATA.stats;
      if (!s || !DATA.config.show_remaining) return '';
      function pill(label, o) {
        if (!o || !o.target) return '';
        var full = o.left <= 0;
        return '<span class="us-pill' + (full ? ' us-pill--full' : '') + '">' + esc(label) +
          (full ? '<b>마감</b>' : '<b>' + o.left + '</b>명') + '</span>';
      }
      var html = pill('전체', s.total) + pill('남성', s.male) + pill('여성', s.female);
      return html ? '<div class="us-h"><h3>잔여 모집 인원</h3></div>' +
        '<div class="us-quota">' + html + '</div>' : '';
    }

    function fields(c) {
      var s = DATA.stats || {};
      var mFull = s.male && s.male.target && s.male.left <= 0;
      var fFull = s.female && s.female.target && s.female.left <= 0;
      var qs = c.questions || [];

      var participant =
        '<div class="us-h"><h3>참가자 정보</h3></div>' +
        '<div class="us-grid">' +
        '<div class="us-pair">' +
        '<div class="us-field"><label for="us-name">이름 <span>*</span></label>' +
        '<input id="us-name" name="name" type="text" autocomplete="name" maxlength="30"></div>' +
        '<div class="us-field"><label for="us-age">만 나이 <span>*</span></label>' +
        '<input id="us-age" name="age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"></div>' +
        '</div>' +
        '<div class="us-field"><label>성별 <span>*</span></label><div class="us-radios">' +
        '<label><input type="radio" name="gender" value="M"' + (mFull ? ' disabled' : '') + '>남성' + (mFull ? ' <i>(마감)</i>' : '') + '</label>' +
        '<label><input type="radio" name="gender" value="F"' + (fFull ? ' disabled' : '') + '>여성' + (fFull ? ' <i>(마감)</i>' : '') + '</label>' +
        '</div></div>' +
        '<div class="us-field"><label for="us-phone">휴대폰 번호 <span>*</span></label>' +
        '<input id="us-phone" name="phone" type="tel" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel" maxlength="13"></div>' +
        '<div class="us-field"><label for="us-email">이메일 <span>*</span></label>' +
        '<input id="us-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="80"></div>' +
        '<div class="us-field us-field--wide"><label for="us-memo">남기실 말 (선택)</label>' +
        '<textarea id="us-memo" name="memo" maxlength="300" placeholder="문의 사항이나 참고할 내용이 있다면 적어 주세요."></textarea></div>' +
        '</div>' +
        '<input class="us-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">';

      /* 질문이 하나도 없으면 섹션 자체를 만들지 않는다 (헤더만 떠 있는 상황 방지) */
      if (!qs.length) return participant;

      var intro = mdLite(c.q_intro);
      var questions =
        '<div class="us-h"><h3>추가 질문</h3></div>' +
        (intro ? '<div class="us-lead us-qintro">' + intro + '</div>' : '') +
        '<div class="us-grid">' +
        qs.map(function (q) {
          return '<div class="us-field us-field--wide us-field--q"><label for="us-' + esc(q.key) + '">' +
            esc(q.label) + ' <span>*</span></label>' +
            '<input id="us-' + esc(q.key) + '" name="' + esc(q.key) + '" type="text" maxlength="200"' +
            (q.placeholder ? ' placeholder="' + esc(q.placeholder) + '"' : '') + '></div>';
        }).join('') +
        '</div>';

      return participant + questions;
    }

    function schedule() {
      return '<div class="us-h"><h3>시간 선택</h3></div>' +
        '<div class="us-days">' + DATA.days.map(dayCard).join('') + '</div>';
    }

    function dayCard(day) {
      var lo = Infinity, hi = -Infinity;
      day.dates.forEach(function (d) {
        d.slots.forEach(function (s) {
          var t = toMin(s.start);
          lo = Math.min(lo, t); hi = Math.max(hi, t + (s.duration || day.duration_min));
        });
      });
      if (!isFinite(lo)) return '';
      var start = Math.floor((lo - 15) / 30) * 30;
      var end = Math.ceil((hi + 15) / 30) * 30;
      var range = end - start;

      var ppm = window.innerWidth <= 620 ? 0.55 : 0.65;
      var headH = window.innerWidth <= 620 ? 27 : 30;
      var bodyH = range * ppm;
      var boardH = headH + bodyH;

      var n = day.dates.length;
      var colWidth = 80;
      var colGap = 7;
      var fixedWidth = 72;
      var dayWidth = Math.max(180, fixedWidth + n * colWidth + Math.max(0, n - 1) * colGap);

      var ticks = '', lines = '';
      for (var t = Math.ceil(start / 60) * 60; t <= end; t += 60) {
        ticks += '<span style="--top:' + (headH + (t - start) * ppm) + 'px">' + fromMin(t) + '</span>';
        if (t <= end - 5) lines += '<i style="--top:' + ((t - start) * ppm) + 'px"></i>';
      }

      var cols = day.dates.map(function (d) {
        var lab = dateLabel(d.date);
        var slots = d.slots.map(function (s) {
          var dur = s.duration || day.duration_min;
          var open = s.available;
          var tag = open && s.left > 1 ? s.left + '자리' : '';
          var stateText = open ? '' : (s.reason === 'past' ? ' 종료' : ' 마감');
          var topPx = (toMin(s.start) - start) * ppm;
          var heightPx = Math.max(dur * ppm - 4, 15);
          return '<button type="button" class="us-slot"' +
            ' style="--top:' + topPx + 'px;--slot-h:' + heightPx + 'px"' +
            ' data-day="' + esc(day.id) + '" data-slot="' + esc(s.id) + '" aria-pressed="false"' +
            (open ? '' : ' disabled') +
            ' aria-label="' + esc(lab.md + ' ' + s.start + '–' + fromMin(toMin(s.start) + dur) + stateText) + '">' +
            '<span class="us-t">' + esc(s.start) + '</span>' +
            (tag ? '<small>' + esc(tag) + '</small>' : '') +
            '</button>';
        }).join('');
        var weekendClass =
          lab.holiday ? ' us-colhead--holiday' :
            lab.dowNum === 0 ? ' us-colhead--sun' :
              lab.dowNum === 6 ? ' us-colhead--sat' : '';

        return '<div class="us-col"><div class="us-colhead' + weekendClass + '">' + lab.md +
          ' <em>(' + lab.dow + ')</em></div><div class="us-colbody" style="--body-h:' + bodyH + 'px">' + slots + '</div></div>';
      }).join('');

      return '<section class="us-day" style="--cols:' + day.dates.length +
        ';--day-w:' + dayWidth + 'px;--day-grow:' + dayWidth + '" data-day="' + esc(day.id) + '">' +
        '<div class="us-dayhead"><h4>' + esc(day.label) +
        '<span class="us-chip">' + day.duration_min + '분</span></h4>' +
        (day.note ? '<p class="us-daynote">' + esc(day.note) + '</p>' : '') + '</div>' +
        '<div class="us-board" style="--board-h:' + boardH + 'px">' +
        '<div class="us-axis">' + ticks + '</div>' +
        '<div class="us-scroll"><div class="us-cols">' +
        '<div class="us-lines">' + lines + '</div>' + cols +
        '</div></div></div>' +
        '<p class="us-picked" data-picked="' + esc(day.id) + '">시간을 선택해 주세요</p>' +
        '</section>';
    }

    function actions(c) {
      return (c.privacy_note ? '<p class="us-note">' + esc(c.privacy_note) + '</p>' : '') +
        '<div class="us-actions">' +
        '<button type="submit" class="us-btn" id="us-submit">' + esc(c.submit_label || '신청하기') + '</button>' +
        '<p class="us-msg" id="us-msg" role="alert"></p></div>';
    }

    /* ---------- interaction ---------- */
    function bind() {
      elMain.querySelectorAll('.us-slot').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var day = btn.dataset.day, slot = btn.dataset.slot;
          var same = picked[day] === slot;
          elMain.querySelectorAll('.us-slot[data-day="' + day + '"]').forEach(function (b) {
            b.setAttribute('aria-pressed', 'false');
          });
          if (same) { delete picked[day]; } else { picked[day] = slot; btn.setAttribute('aria-pressed', 'true'); }
          updatePicked(day);
        });
      });

      var age = document.getElementById('us-age');
      if (age) age.addEventListener('input', function () {
        age.value = age.value.replace(/\D/g, '').slice(0, 3);
      });

      var phone = document.getElementById('us-phone');
      phone.addEventListener('input', function () {
        var v = phone.value.replace(/\D/g, '').slice(0, 11);
        phone.value = v.length > 7 ? v.slice(0, 3) + '-' + v.slice(3, v.length - 4) + '-' + v.slice(-4)
          : v.length > 3 ? v.slice(0, 3) + '-' + v.slice(3) : v;
      });

      document.getElementById('us-form').addEventListener('submit', submit);
    }

    function updatePicked(dayId) {
      var day = DATA.days.filter(function (d) { return d.id === dayId; })[0];
      var el = elMain.querySelector('[data-picked="' + dayId + '"]');
      var id = picked[dayId];
      if (!id) { el.textContent = '시간을 선택해 주세요'; return; }
      var found;
      day.dates.forEach(function (d) {
        d.slots.forEach(function (s) { if (s.id === id) found = { d: d, s: s }; });
      });
      if (!found) return;
      var lab = dateLabel(found.d.date);
      var dur = found.s.duration || day.duration_min;
      el.innerHTML = '<b>' + esc(lab.md + ' (' + lab.dow + ') ' + found.s.start + '–' +
        fromMin(toMin(found.s.start) + dur)) + '</b>';
    }

    /** Config 에 설정된 추가 질문 목록 (없으면 빈 배열) */
    function questionList() {
      return (DATA && DATA.config && DATA.config.questions) || [];
    }

    function snapshotForm() {
      var answers = {};
      questionList().forEach(function (q) {
        answers[q.key] = (document.getElementById('us-' + q.key) || {}).value || '';
      });
      return {
        name: (document.getElementById('us-name') || {}).value || '',
        age: (document.getElementById('us-age') || {}).value || '',
        gender: (elMain.querySelector('input[name="gender"]:checked') || {}).value || '',
        phone: (document.getElementById('us-phone') || {}).value || '',
        email: (document.getElementById('us-email') || {}).value || '',
        answers: answers,
        memo: (document.getElementById('us-memo') || {}).value || '',
        picked: Object.assign({}, picked)
      };
    }

    function restoreForm(state, options) {
      options = options || {};
      var clearSlots = options.clearSlots || [];

      var name = document.getElementById('us-name');
      var age = document.getElementById('us-age');
      var phone = document.getElementById('us-phone');
      var email = document.getElementById('us-email');
      var memo = document.getElementById('us-memo');

      if (name) name.value = state.name;
      if (age) age.value = state.age || '';
      if (phone) phone.value = state.phone;
      if (email) email.value = state.email;
      if (memo) memo.value = state.memo;

      questionList().forEach(function (q) {
        var el = document.getElementById('us-' + q.key);
        if (el) el.value = (state.answers && state.answers[q.key]) || '';
      });

      // 성별 마감이 아니면 기존 선택 복원. 최신 화면에서 disabled가 됐다면 복원하지 않는다.
      if (!options.clearGender && state.gender) {
        var genderInput = elMain.querySelector(
          'input[name="gender"][value="' + state.gender + '"]:not(:disabled)'
        );

        if (genderInput) {
          genderInput.checked = true;
        }
      }

      /* render() 후 슬롯 선택을 새로 구축 */
      picked = {};
      Object.keys(state.picked).forEach(function (dayId) {
        var slotId = state.picked[dayId];

        /* 서버가 충돌했다고 알려준 슬롯만 버림 */
        if (clearSlots.indexOf(slotId) !== -1) {
          return;
        }

        /* 최신 데이터에서도 실제로 열려 있는 경우에만 복원 */
        var btn = elMain.querySelector(
          '.us-slot[data-day="' + dayId +
          '"][data-slot="' + slotId + '"]:not(:disabled)'
        );

        if (!btn) return;

        picked[dayId] = slotId;
        btn.setAttribute('aria-pressed', 'true');
        updatePicked(dayId);
      });
    }

    function refreshPreserving(state, options) {
      return jsonp(API_URL).then(function (res) {
        if (!res || !res.ok) {
          throw new Error(res && res.message || 'bad response');
        }

        DATA = res.data;

        /* 전체 모집이 끝났다면 복원하지 않고 정식 마감 화면 */
        if (DATA.closed) {
          render();
          return;
        }

        render();
        restoreForm(state, options);
      });
    }

    function applyServerData(state, options, data) {
      // 새 서버에서는 POST 응답에 최신 public data가 같이 온다.
      // 구버전 서버 등으로 data가 없을 때만 기존 GET 방식으로 fallback.
      if (!data) {
        return refreshPreserving(state, options);
      }

      DATA = data;

      if (DATA.closed) {
        render();
        return Promise.resolve();
      }

      render();
      restoreForm(state, options);

      return Promise.resolve();
    }

    function submit(e) {
      e.preventDefault();
      var msg = document.getElementById('us-msg');
      var btn = document.getElementById('us-submit');
      msg.textContent = '';

      var name = document.getElementById('us-name').value.trim();
      var ageV = document.getElementById('us-age').value.trim();
      var gender = (elMain.querySelector('input[name="gender"]:checked') || {}).value;
      var phoneV = document.getElementById('us-phone').value.trim();
      var email = document.getElementById('us-email').value.trim();

      if (name.length < 2) {
        document.getElementById('us-name').focus();
        return fail(msg, '이름을 입력해 주세요.');
      }

      if (!/^\d{1,3}$/.test(ageV) || +ageV < 1 || +ageV > 120) {
        document.getElementById('us-age').focus();
        return fail(msg, '만 나이를 입력해 주세요.');
      }

      if (!gender) {
        var genderEl = elMain.querySelector('input[name="gender"]:not(:disabled)');
        if (genderEl) genderEl.focus();
        return fail(msg, '성별을 선택해 주세요.');
      }

      if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test(phoneV)) {
        document.getElementById('us-phone').focus();
        return fail(msg, '휴대폰 번호를 정확히 입력해 주세요.');
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        document.getElementById('us-email').focus();
        return fail(msg, '이메일을 정확히 입력해 주세요.');
      }

      /* Config 에 표시된 추가 질문은 모두 필수 */
      var qs = questionList();
      var answers = {};
      for (var qi = 0; qi < qs.length; qi++) {
        var qEl = document.getElementById('us-' + qs[qi].key);
        var qVal = qEl ? qEl.value.trim() : '';
        if (!qVal) {
          if (qEl) qEl.focus();
          return fail(msg, '"' + qs[qi].label.replace(/\s+/g, ' ').trim() + '" 항목을 입력해 주세요.');
        }
        answers[qs[qi].key] = qVal;
      }

      var missing = DATA.days.filter(function (d) { return !picked[d.id]; });
      if (missing.length) {
        var card = elMain.querySelector('.us-day[data-day="' + missing[0].id + '"]');
        if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return fail(msg, missing[0].label + ' 시간을 선택해 주세요.');
      }

      var payload = Object.assign({
        name: name, age: ageV, gender: gender, phone: phoneV, email: email,
        memo: document.getElementById('us-memo').value.trim(),
        website: elMain.querySelector('input[name="website"]').value,
        slots: DATA.days.map(function (d) { return picked[d.id]; })
      }, answers);

      btn.disabled = true; btn.textContent = '신청 중…';
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request → no CORS preflight
        body: JSON.stringify(payload)
      }).then(function (r) {
        return r.json();
      }).then(function (res) {
        if (res && res.ok) {
          return done(res.result);
        }

        btn.disabled = false;
        btn.textContent = DATA.config.submit_label || '신청하기';

        // 서버 오류 응답을 받았을 당시 입력 상태
        var state = snapshotForm();

        // 1. 선택 슬롯 일부가 마감됨
        if (res && res.error === 'SLOT_CONFLICT') {
          alert(res.message || '선택하신 시간 중 일부가 방금 마감되었습니다. 다시 선택해 주세요.');
          return applyServerData(state, { clearSlots: Array.isArray(res.slot_ids) ? res.slot_ids : [] }, res.data);
        }

        // 2. 특정 성별 모집 마감
        if (res && res.error === 'GENDER_FULL') {
          alert(res.message || '선택하신 성별의 모집이 방금 마감되었습니다.');
          return applyServerData(state, { clearGender: true }, res.data);
        }

        // 3. 전체 모집 인원 마감
        if (res && res.error === 'TOTAL_FULL') {
          alert(res.message || '모집이 방금 모두 마감되었습니다.');
          if (res.data) { DATA = res.data; render(); return; }
          return load();
        }

        // 4. accepting OFF / close_at 등
        if (res && res.error === 'CLOSED') {
          alert(res.message || '현재 신청을 받고 있지 않습니다.');
          if (res.data) { DATA = res.data; render(); return; }
          return load();
        }

        msg.textContent =
          (res && res.message) ||
          '신청에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      }).catch(function (err) {
        console.error('[userstudy]', err);
        btn.disabled = false; btn.textContent = DATA.config.submit_label || '신청하기';
        msg.textContent = '네트워크 오류입니다. 잠시 후 다시 시도해 주세요.';
      });
    }

    function fail(msg, text) { msg.textContent = text; return false; }

    function done(result) {
      var c = DATA.config;
      var items = (result.items || []).map(function (i) {
        var lab = dateLabel(i.date);
        return '<li>' + esc(i.day + ' — ' + lab.md + ' (' + lab.dow + ') ' + i.start + '–' + i.end) + '</li>';
      }).join('');
      elMain.innerHTML =
        '<div class="us-eyebrow">' + esc(c.eyebrow || 'USER STUDY') + '</div>' +
        '<h2 class="us-title">신청이 완료되었습니다</h2>' +
        '<div class="us-done"><h3>' + esc(c.title || '') + '</h3><ul>' + items + '</ul>' +
        (c.location ? '<p>장소 · ' + esc(c.location) + '</p>' : '') +
        '<p>예약 번호 · ' + esc(result.id) + '</p></div>' +
        '<p class="us-note">일정 변경이나 취소가 필요하면 ' +
        (safeMail(c.contact) ? '<a href="mailto:' + esc(safeMail(c.contact)) + '">' + esc(c.contact) + '</a>'
          : esc(c.contact || '담당자')) +
        '로 알려 주세요.</p>';
      window.scrollTo({ top: root.offsetTop - 60, behavior: 'smooth' });
    }

    load();
  })();
</script>
{% endraw %}
